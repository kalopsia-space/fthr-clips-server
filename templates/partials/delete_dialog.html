<dialog id="delete-dialog" class="dlg" aria-labelledby="delete-title">
  <h2 id="delete-title">Delete</h2>
  <p id="delete-text"></p>
  <label id="delete-file-row" class="check" hidden><input type="checkbox" id="delete-file"> Also delete the file from disk</label>
  <div class="dlg-actions">
    <button class="btn ghost" type="button" id="delete-cancel">Cancel</button>
    <button class="btn danger" type="button" id="delete-confirm">Delete</button>
  </div>
</dialog>
