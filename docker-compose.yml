services:
  fthr-clips-server:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"
    env_file: .env
    # 1g is enough with TRANSCODING=off; use 2g when transcoding is on.
    mem_limit: 2g
    # Transcoding (libx264 is multi-threaded) needs headroom on many-core hosts.
    pids_limit: 256
    volumes:
      - clips-data:/data
      # Optional scan folders (set VIDEO_DIRS=/videos and IMAGE_DIRS=/images in .env):
      # - /path/to/videos:/videos:ro
      # - /path/to/images:/images:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  clips-data:
