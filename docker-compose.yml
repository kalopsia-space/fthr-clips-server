services:
  fthr-clips-server:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"
    env_file: .env
    volumes:
      - clips-data:/data
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  clips-data:
