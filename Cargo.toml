[package]
name = "fthr-clips-server"
version = "2.0.0-alpha.1"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
axum = { version = "0.8", features = ["multipart", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["compression-gzip", "compression-br", "trace", "timeout", "set-header", "fs"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "chrono", "derive", "macros"] }
askama = "0.14"
rust-embed = "8"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
argon2 = "0.5"
subtle = "2"
sha2 = "0.10"
rand = "0.9"
notify = "8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rss = "2"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
walkdir = "2"
tokio-util = { version = "0.7", features = ["io", "rt"] }
sysinfo = { version = "0.37", default-features = false, features = ["disk"] }
futures = "0.3"
http-body-util = "0.1"
mime_guess = "2"
infer = "0.19"
hex = "0.4"
ipnet = "2"
base64 = "0.22"
urlencoding = "2"
tokio-stream = { version = "0.1", features = ["sync"] }
async-stream = "0.3"

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
